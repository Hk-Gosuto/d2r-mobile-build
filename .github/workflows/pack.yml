name: Reusable prepared-input build
on:
  workflow_call:
    inputs:
      source_repository:
        type: string
        default: jhaizhou-ops/d2r-mobile
      source_ref:
        type: string
        default: ''
    secrets:
      PREPARED_INPUT:
        required: true
      SOURCE_TOKEN:
        required: false
permissions:
  contents: write
  actions: write
concurrency:
  group: d2r-build
  queue: max
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      tools_commit: ${{ steps.tools.outputs.tools_commit }}
      input_revision: ${{ steps.input.outputs.input_revision }}
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check destination and fix the tools revision
        id: tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json, os, re, subprocess, time
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          repo = os.environ['GITHUB_REPOSITORY']
          meta = api('repos/' + repo)
          if meta.get('private') is not True:
              raise SystemExit('Create your own PRIVATE repository using this template before building game files.')
          for attempt in range(3):
              run = api('repos/' + repo + '/actions/runs/' + os.environ['GITHUB_RUN_ID'])
              refs = [item['sha'] for item in run.get('referenced_workflows', [])
                      if item['path'].split('@')[0] == 'jiayx/d2r-mobile-build/.github/workflows/pack.yml']
              if len(set(refs)) == 1 and re.fullmatch('[a-f0-9]{40}', refs[0]):
                  break
              time.sleep(2)
          else:
              raise SystemExit('Cannot resolve the exact reusable workflow commit; refusing mixed tool versions.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('tools_commit=' + refs[0] + '\n')
          PYCODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jiayx/d2r-mobile-build
          ref: ${{ steps.tools.outputs.tools_commit }}
          persist-credentials: false
      - name: Select the latest release or requested source
        id: source
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN || github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: python3 scripts/source/resolve.py
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ secrets.SOURCE_TOKEN || github.token }}
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0
          path: upstream
          persist-credentials: false
      - name: Record the selected source and build identity
        run: python3 scripts/source/configure.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-inputs.txt
      - name: Install the input downloader
        run: python -m pip install -r requirements-inputs.txt
      - name: Resolve the prepared package checksum
        id: input
        env:
          PREPARED_INPUT: ${{ secrets.PREPARED_INPUT }}
        run: python scripts/source/prepared.py resolve
      - name: Restore the original prepared package
        id: archive
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .prepared-downloads
          key: prepared-input-v1-${{ steps.input.outputs.input_revision }}
      - name: Download and verify the prepared package
        env:
          PREPARED_INPUT: ${{ secrets.PREPARED_INPUT }}
          INPUT_REVISION: ${{ steps.input.outputs.input_revision }}
        run: python scripts/source/prepared.py download
      - name: Cache the completed download before preparing the build
        if: steps.archive.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .prepared-downloads
          key: ${{ steps.archive.outputs.cache-primary-key }}
      - name: Verify compatibility and prepare current native sources
        env:
          TOOLS_COMMIT: ${{ steps.tools.outputs.tools_commit }}
          INPUT_REVISION: ${{ steps.input.outputs.input_revision }}
        run: python scripts/source/prepared.py prepare
      - name: Upload verified native build inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-source-inputs
          overwrite: true
          path: |
            outputs/native-inputs.tar.gz
            outputs/source-payload.zip
            outputs/source-input-report.json
            outputs/build-context.json
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Upload resource links and current build metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-metadata
          overwrite: true
          path: |
            outputs/build-context.json
            outputs/resource-manifest.json
            outputs/resources.json
            outputs/legacy-resources.json
          retention-days: 3
          if-no-files-found: error
  native:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        minimum: ['26.0', '18.0']
    env:
      INPUT_REVISION: ${{ needs.prepare.outputs.input_revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jiayx/d2r-mobile-build
          ref: ${{ needs.prepare.outputs.tools_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-source-inputs
          path: outputs
      - name: Select macOS 26 and iOS 26.4+ SDK
        run: python3 scripts/source/select_xcode.py
      - name: Prepare native build dependencies
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 -m venv .venv
          .venv/bin/pip install PyYAML==6.0.2
          tar -xzf outputs/native-inputs.tar.gz
      - name: Compile and verify the IPA
        env:
          MINIMUM_IOS: ${{ matrix.minimum }}
        run: |
          set -o pipefail
          .venv/bin/python scripts/source/build.py "$MINIMUM_IOS" 2>&1 | tee outputs/native-build.log
      - name: Upload the verified IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: IPA-ios${{ matrix.minimum }}
          overwrite: true
          path: |
            outputs/D2RMobile-*.ipa
            outputs/source*-report.json
            outputs/source*-SHA256SUMS.txt
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: [prepare, native]
    if: ${{ !cancelled() && needs.native.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      INPUT_REVISION: ${{ needs.prepare.outputs.input_revision }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jiayx/d2r-mobile-build
          ref: ${{ needs.prepare.outputs.tools_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build-metadata
          path: outputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: IPA-ios*
          merge-multiple: true
          path: outputs
      - name: Publish to your private Releases
        run: |
          python3 scripts/source/finalize.py
      - name: Delete intermediate inputs after a successful build
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          repo, run = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_RUN_ID']
          data = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts'],text=True))
          for item in data['artifacts']:
              if item['name'] in ('translated-source-inputs','native-source-inputs','build-metadata','game-input-metadata','data-metadata','legacy-metadata','legacy-worker-0','legacy-worker-1'):
                  subprocess.run(['gh','api','--method','DELETE',f"repos/{repo}/actions/artifacts/{item['id']}"],check=True)
          PYCODE
