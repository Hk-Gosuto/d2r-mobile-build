name: Reusable source build
on:
  workflow_call:
    inputs:
      source_repository:
        type: string
        default: jhaizhou-ops/d2r-mobile
      source_ref:
        type: string
        default: ''
    secrets:
      GAME_ARCHIVE:
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: d2r-build
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tools_commit: ${{ steps.resolve.outputs.tools_commit }}
      input_revision: ${{ steps.resolve.outputs.input_revision }}
    steps:
      - name: Check destination and fix the tools revision
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ARCHIVE: ${{ secrets.GAME_ARCHIVE }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, re, subprocess, time
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          repo = os.environ['GITHUB_REPOSITORY']
          meta = api('repos/' + repo)
          if meta.get('private') is not True:
              raise SystemExit('Create your own PRIVATE repository using this template before building game files.')
          try:
              config = json.loads(os.environ['GAME_ARCHIVE'])
          except ValueError:
              raise SystemExit('GAME_ARCHIVE must be a JSON object with url and optional sha256.')
          if not isinstance(config, dict) or not isinstance(config.get('url'), str):
              raise SystemExit('GAME_ARCHIVE must contain a download url.')
          url = config['url'].strip()
          digest = config.get('sha256')
          if digest is None:
              digest = ''
          if not isinstance(digest, str):
              raise SystemExit('sha256 must be a string or null.')
          digest = digest.strip().lower()
          if digest and not re.fullmatch('[a-f0-9]{64}', digest):
              raise SystemExit('sha256 must be empty or contain 64 hexadecimal characters.')
          from urllib.parse import urlsplit
          parsed = urlsplit(url)
          if parsed.scheme != 'https' or not parsed.hostname or parsed.username or parsed.password:
              raise SystemExit('url must be an HTTPS direct download URL.')
          identity = digest if digest else 'url:' + url
          for attempt in range(3):
              run = api('repos/' + repo + '/actions/runs/' + os.environ['GITHUB_RUN_ID'])
              refs = [item['sha'] for item in run.get('referenced_workflows', [])
                      if item['path'].split('@')[0] == 'jiayx/d2r-mobile-build/.github/workflows/pack.yml']
              if len(set(refs)) == 1 and re.fullmatch('[a-f0-9]{40}', refs[0]):
                  break
              time.sleep(2)
          else:
              raise SystemExit('Cannot resolve the exact reusable workflow commit; refusing mixed tool versions.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('tools_commit=' + refs[0] + '\ninput_revision=' + hashlib.sha256(identity.encode()).hexdigest() + '\n')
          PYCODE
  prepare:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SOURCE_BUILD: '1'
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      TOOLS_COMMIT: ${{ needs.resolve.outputs.tools_commit }}
      DM_ROOT: ${{ github.workspace }}/.dm-work
      INPUT_REVISION: ${{ needs.resolve.outputs.input_revision }}
      D2RM_NO_METAL: '1'
      PYTHONUTF8: '1'
      J: '2'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jiayx/d2r-mobile-build
          ref: ${{ needs.resolve.outputs.tools_commit }}
          persist-credentials: false
      - name: Read the default upstream commit
        id: config
        run: python3 -c 'import json,os; c=json.load(open("build-config.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("commit="+c["upstream_commit"]+"\n")'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref || steps.config.outputs.commit }}
          path: upstream
          persist-credentials: false
      - name: Record the selected source and patches
        run: python3 scripts/source/configure.py
      - name: Make room for game extraction on the disposable runner
        run: |
          # Only remove unrelated preinstalled SDKs on GitHub's temporary VM.
          sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc
          df -h "$GITHUB_WORKSPACE"
          python - <<'PYCODE'
          import shutil
          free = shutil.disk_usage('.').free / 1024**3
          print(f'Free disk space: {free:.1f} GiB')
          if free < 32:
              raise SystemExit('Insufficient disk space: game extraction needs at least 32 GiB free')
          PYCODE
      - name: Restore the original input archive
        id: downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .game-downloads
          key: input-archive-v1-${{ needs.resolve.outputs.input_revision }}
      - name: Download and verify the user-supplied archive
        env:
          GAME_ARCHIVE: ${{ secrets.GAME_ARCHIVE }}
        run: python scripts/archive_input.py download
      - name: Save the original archive BEFORE extraction
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .game-downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Confirm the download cache is available
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .game-downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Extract and validate ExeFS/RomFS
        env:
          GAME_ARCHIVE: ${{ secrets.GAME_ARCHIVE }}
        run: python scripts/archive_input.py prepare
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Install compiler and archive tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build fonts-dejavu-core libjpeg-dev zlib1g-dev libfreetype6-dev libraqm-dev
          python -m pip install -r requirements.txt
          df -h "$GITHUB_WORKSPACE"
      - name: Compute dependency cache keys
        id: cache-keys
        run: python scripts/cache_keys.py
      - name: Restore build tools
        id: tools
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools
          key: tools-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.tools }}
      - name: Restore generated build cache
        id: generated
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .dm-work/build/cache/dm/out
            upstream/dm/ios/Gen/assets
            upstream/dm/ios/Sources/TouchArt
            upstream/dm/ios/Sources/dm_touch_native_art.c
          key: generated-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build-config.json', 'requirements.txt', 'scripts/tools.sh', 'scripts/png_backend.sh') }}-${{ needs.resolve.outputs.input_revision }}
      - name: Build and verify toolchain
        run: |
          bash scripts/tools.sh
          python upstream/dm/gfx/tools/nometal_run.py upstream/dm/gfx/tools/dmsh_chain.py --header
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
      - name: Compute verified shader cache key
        id: shader-key
        run: python scripts/cache_keys.py shaders
      - name: Restore matching shader outputs
        id: shaders
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .dm-work/build/cache/dm/dmsh
            .dm-work/build/cache/metal_shader_cache
            .dm-work/build/ios/dmsh_b
          key: shaders-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.shader-key.outputs.shaders }}
      - name: Restore PNG compression backend
        id: png
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tools/png-zlib-ng-2.3.2
          key: png-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/png_backend.sh') }}
      - name: Pin the verified PNG compression backend
        run: |
          bash scripts/png_backend.sh
          LD_PRELOAD="$GITHUB_WORKSPACE/.tools/png-zlib-ng-2.3.2/lib/libz.so.1" python - <<'PY'
          from PIL import features
          assert features.version('zlib') == '1.3.1.zlib-ng', features.version('zlib')
          print('Verified PNG compressor:', features.version('zlib'))
          PY
      - name: Save PNG compression backend
        if: steps.png.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tools/png-zlib-ng-2.3.2
          key: ${{ steps.png.outputs.cache-primary-key }}
      - name: Save verified build tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - name: Verify frozen PNG hashes
        run: LD_PRELOAD="$GITHUB_WORKSPACE/.tools/png-zlib-ng-2.3.2/lib/libz.so.1" python -u scripts/png_preflight.py
      - name: Generate or reuse your Legacy Device Pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/legacy_pack.py
      - name: Generate or reuse your Data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/publish_release.py prepare-resources
      - name: Generate game payload and native source inputs
        run: LD_PRELOAD="$GITHUB_WORKSPACE/.tools/png-zlib-ng-2.3.2/lib/libz.so.1" python -u scripts/source/prepare.py
      - name: Save generated build cache
        if: success() && steps.generated.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .dm-work/build/cache/dm/out
            upstream/dm/ios/Gen/assets
            upstream/dm/ios/Sources/TouchArt
            upstream/dm/ios/Sources/dm_touch_native_art.c
          key: ${{ steps.generated.outputs.cache-primary-key }}
      - name: Save verified shader outputs
        if: success() && steps.shaders.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .dm-work/build/cache/dm/dmsh
            .dm-work/build/cache/metal_shader_cache
            .dm-work/build/ios/dmsh_b
          key: ${{ steps.shaders.outputs.cache-primary-key }}
      - name: Upload intermediate native build inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-source-inputs
          path: |
            outputs/native-inputs.tar.gz
            outputs/source-payload.zip
            outputs/source-input-report.json
            outputs/build-config.json
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Upload build metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-metadata
          path: |
            outputs/build-config.json
            outputs/resource-manifest.json
            outputs/resources.json
            outputs/legacy-resources.json
            outputs/RESOURCE-INSTALL.txt
          retention-days: 3
          if-no-files-found: error
  native:
    needs: [resolve, prepare]
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        minimum: ['26.0', '18.0']
    env:
      INPUT_REVISION: ${{ needs.resolve.outputs.input_revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jiayx/d2r-mobile-build
          ref: ${{ needs.resolve.outputs.tools_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-source-inputs
          path: outputs
      - name: Select macOS 26 and iOS 26.4+ SDK
        run: python3 scripts/source/select_xcode.py
      - name: Prepare native build dependencies
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 -m venv .venv
          .venv/bin/pip install PyYAML==6.0.2
          tar -xzf outputs/native-inputs.tar.gz
          cp outputs/build-config.json build-config.json
      - name: Compile and verify the IPA
        env:
          MINIMUM_IOS: ${{ matrix.minimum }}
        run: |
          set -o pipefail
          .venv/bin/python scripts/source/build.py "$MINIMUM_IOS" 2>&1 | tee outputs/native-build.log
      - name: Upload the verified IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: IPA-ios${{ matrix.minimum }}
          path: |
            outputs/D2RMobile-*.ipa
            outputs/source*-report.json
            outputs/source*-SHA256SUMS.txt
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: [resolve, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      INPUT_REVISION: ${{ needs.resolve.outputs.input_revision }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jiayx/d2r-mobile-build
          ref: ${{ needs.resolve.outputs.tools_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build-metadata
          path: outputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: IPA-ios*
          merge-multiple: true
          path: outputs
      - name: Publish to your private Releases
        run: |
          cp outputs/build-config.json build-config.json
          python3 scripts/source/finalize.py
      - name: Delete intermediate inputs after a successful build
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          repo, run = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_RUN_ID']
          data = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts'],text=True))
          for item in data['artifacts']:
              if item['name'] in ('native-source-inputs','build-metadata'):
                  subprocess.run(['gh','api','--method','DELETE',f"repos/{repo}/actions/artifacts/{item['id']}"],check=True)
          PYCODE
