name: Upload validated prepared packages
on:
  push:
    branches: [experiment/prepared-runtime-validation]
    paths: [.github/workflows/upload-validated-prepared.yml]
permissions:
  contents: read
  actions: read
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Wait for the Mac and interface validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 38738891429 --repo jiayx/d2r-mobile-build --interval 30 --exit-status
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: runtime-prepared-packages
          path: inputs
          run-id: 38736290858
          github-token: ${{ github.token }}
      - name: Upload verified packages to new object keys
        env:
          UPLOAD_TARGETS: ${{ secrets.PREPARED_UPLOAD_TARGETS }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          targets = json.loads(os.environ['UPLOAD_TARGETS'])
          result = []
          for item in targets:
              print('::add-mask::' + item['url'], flush=True)
              path = Path('inputs') / item['name']
              digest = hashlib.file_digest(path.open('rb'), 'sha256').hexdigest()
              if digest != item['sha256']:
                  raise ValueError('Prepared package checksum mismatch')
              for attempt in range(3):
                  try:
                      with path.open('rb') as stream:
                          request = urllib.request.Request(item['url'], data=stream, method='PUT',
                              headers={'Content-Length': str(path.stat().st_size), 'Content-Type': 'application/zip'})
                          with urllib.request.urlopen(request, timeout=300) as response:
                              cid = response.headers.get('x-amz-meta-cid')
                      break
                  except Exception:
                      if attempt == 2:
                          raise RuntimeError('Prepared package upload failed') from None
                      time.sleep(10)
              result.append({'name': item['name'], 'key': item['key'], 'sha256': digest,
                             'bytes': path.stat().st_size, 'cid': cid})
              print('Uploaded', item['name'], flush=True)
          Path('upload-result.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: prepared-upload-result
          path: upload-result.json
          retention-days: 3
          if-no-files-found: error
