name: Export D2R Mobile resources
on:
  workflow_dispatch:
    inputs:
      input_revision:
        description: Existing original download cache revision
        type: string
        default: game-3.3.94012-v1
permissions:
  contents: write
concurrency:
  group: d2r-build
  cancel-in-progress: false
jobs:
  resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DM_ROOT: ${{ github.workspace }}/.dm-work
      INPUT_REVISION: ${{ inputs.input_revision }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate cache revision
        env:
          INPUT_REVISION: ${{ inputs.input_revision }}
        run: |
          [[ "$INPUT_REVISION" =~ ^[A-Za-z0-9._-]{1,64}$ ]]
          python -m unittest discover -s tests -v
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jhaizhou-ops/d2r-mobile
          ref: 46578a2b5d302de5d01b5d50b68e2a077e5da0ad
          path: upstream
          persist-credentials: false
      - name: Make room on the disposable runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc
          python - <<'PY'
          import shutil
          assert shutil.disk_usage('.').free >= 28 * 1024**3, 'Insufficient extraction disk space'
          PY
      - name: Restore extraction tools
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build-config.json', 'scripts/tools.sh') }}
          fail-on-cache-miss: true
      - name: Restore complete original downloads
        id: downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .game-downloads
          key: downloads-${{ runner.os }}-${{ inputs.input_revision }}
          fail-on-cache-miss: true
      - name: Verify cached packages and extract matching game
        env:
          GAME_INPUT_MANIFEST: ${{ secrets.GAME_INPUT_MANIFEST }}
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          test -x .tools/bin/hactool
          python -u scripts/ci.py inputs
      - name: Export and verify the 18 phone resources
        run: python -u scripts/export_resources.py
      - name: Upload resource package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: D2R-Mobile-Resources-${{ github.run_number }}
          path: |
            outputs/D2R-Mobile-Resources.zip
            outputs/resources-report.json
            outputs/Resources-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Automatically publish resources to the matching Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/publish_release.py resources
      - name: Report export
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('outputs/resources-report.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"Exported and verified {report['archive_count']} resource archives ({report['resource_bytes']} bytes).\n\n")
              f.write('Original packages restored from existing cache; no game download or IPA rebuild.\n\n')
              f.write('Unzip the resource ZIP, then copy D2R Mobile Resources into the app using Finder file sharing.\n')
          PY
