name: Build IPA and Data
run-name: Source build · ${{ inputs.source_ref || 'supported release' }}
on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Upstream source repository or your fork
        type: string
        default: jhaizhou-ops/d2r-mobile
      source_ref:
        description: Branch, tag or commit (empty uses the supported release)
        type: string
        default: ''
permissions:
  contents: write
  actions: write
jobs:
  build:
    uses: jiayx/d2r-mobile-build/.github/workflows/pack.yml@main
    with:
      source_repository: ${{ inputs.source_repository }}
      source_ref: ${{ inputs.source_ref }}
    secrets:
      GAME_ARCHIVE_URL: ${{ secrets.GAME_ARCHIVE_URL }}
      GAME_ARCHIVE_SHA256: ${{ secrets.GAME_ARCHIVE_SHA256 }}
