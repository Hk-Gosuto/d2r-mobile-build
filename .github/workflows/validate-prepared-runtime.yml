name: Validate prepared runtime inputs
on:
  push:
    branches: [experiment/prepared-runtime-validation]
    paths: [.github/workflows/validate-prepared-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reserve space on the disposable runner
        run: sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .game-downloads
          key: downloads-Linux-game-3.3.94012-v1
          fail-on-cache-miss: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jiayx/d2r-mobile-build
          ref: legacy
          path: legacy-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jhaizhou-ops/d2r-mobile
          ref: v1.0.16
          fetch-depth: 0
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install input extraction and interface generation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang p7zip-full p7zip-rar
          python -m pip install -r requirements.txt -r legacy-source/requirements.txt
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .tools
          key: tools-v2-Linux-X64-59f0ebb26028b6566c763623f46dcd1a0affbaedcb5e987fc503bf332343f75b
          fail-on-cache-miss: true
      - name: Extract retained original inputs once
        env:
          GAME_INPUT_MANIFEST: ${{ secrets.GAME_INPUT_MANIFEST }}
        run: |
          ln -s "$GITHUB_WORKSPACE/.tools" legacy-source/.tools
          ln -s "$GITHUB_WORKSPACE/upstream" legacy-source/upstream
          test -f legacy-source/upstream/dm/host/romfs_validate.c
          mv .game-downloads legacy-source/.game-downloads
          test -x .tools/bin/hactool
          python legacy-source/scripts/ci.py inputs
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .prepared-downloads
          key: prepared-input-v1-a0e47215a8ea9077a128a1de1d51e283911dba06de06bea7b00c151db2c8e11f
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .macos-downloads
          key: macos-input-v1-c88f6cc8579fc544b52745cd73c16a7559921a32fccfa923d9ae9fc9f457fa3e
          fail-on-cache-miss: true
      - name: Record current source
        env:
          SOURCE_REPOSITORY: jhaizhou-ops/d2r-mobile
        run: python scripts/source/configure.py
      - name: Migrate existing prepared packages and generate current interface
        env:
          SOURCE_REPOSITORY: jhaizhou-ops/d2r-mobile
          TOOLS_COMMIT: ${{ github.sha }}
        run: python -u .github/scripts/validate_prepared_runtime.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime-prepared-packages
          path: |
            outputs/D2RMobile-Prepared.zip
            outputs/D2RMobile-MacPrepared.zip
            outputs/*SHA256SUMS.txt
            outputs/prepared-migration-report.json
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-source-inputs
          path: |
            outputs/native-inputs.tar.gz
            outputs/source-payload.zip
            outputs/source-input-report.json
            outputs/build-context.json
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  macos:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SOURCE_REPOSITORY: jhaizhou-ops/d2r-mobile
      TOOLS_COMMIT: ${{ github.sha }}
      INPUT_REVISION: runtime-validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-source-inputs
          path: outputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: runtime-prepared-packages
          path: outputs
      - name: Restore Mac prepared inputs and current source
        run: |
          tar -xzf outputs/native-inputs.tar.gz
          mkdir -p .macos-downloads
          cp outputs/D2RMobile-MacPrepared.zip .macos-downloads/prepared-input.archive
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt pillow==12.1.1 numpy==2.4.4
          .venv/bin/python scripts/macos.py import
      - name: Select Apple toolchain
        run: python3 scripts/source/select_xcode.py
      - name: Check Metal inspection tool
        run: xcrun --sdk macosx metal-objdump --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Build both Mac apps from current source
        run: .venv/bin/python scripts/macos.py build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macOS-runtime-validation
          path: |
            outputs/D2RMobile-*-macos*.zip
            outputs/macos-build-report.json
            outputs/Mac-SHA256SUMS.txt
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  native:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        minimum: ['26.0', '18.0']
    env:
      INPUT_REVISION: runtime-validation
      GH_TOKEN: ${{ github.token }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jiayx/d2r-mobile-build
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-source-inputs
          path: outputs
      - name: Select macOS 26 and iOS 26.4+ SDK
        id: xcode
        run: python3 scripts/source/select_xcode.py
      - name: Restore matching native compiler modules
        id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-module-cache
          key: native-modules-v1-${{ runner.arch }}-${{ matrix.minimum }}-${{ steps.xcode.outputs.toolchain }}
      - name: Prepare native build dependencies
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 -m venv .venv
          .venv/bin/pip install PyYAML==6.0.2
          tar -xzf outputs/native-inputs.tar.gz
      - name: Compile and verify the IPA
        env:
          MINIMUM_IOS: ${{ matrix.minimum }}
          NATIVE_MODULE_CACHE_HIT: ${{ steps.modules.outputs.cache-hit }}
        run: |
          set -o pipefail
          .venv/bin/python scripts/source/build.py "$MINIMUM_IOS" 2>&1 | tee outputs/native-build.log
      - name: Check compiler cache budget
        id: budget
        if: steps.modules.outputs.cache-hit != 'true'
        run: python3 scripts/cache_budget.py
      - name: Save native compiler modules when space permits
        if: steps.modules.outputs.cache-hit != 'true' && steps.budget.outputs.native == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-module-cache
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - name: Upload the verified IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: IPA-ios${{ matrix.minimum }}
          overwrite: true
          path: |
            outputs/D2RMobile-*.ipa
            outputs/source*-report.json
            outputs/build-context.json
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
