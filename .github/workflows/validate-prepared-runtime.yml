name: Validate prepared runtime inputs
on:
  push:
    branches: [experiment/prepared-runtime-validation]
    paths: [.github/workflows/validate-prepared-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  SOURCE_REPOSITORY: jhaizhou-ops/d2r-mobile
  INPUT_REVISION: runtime-validation
  TOOLS_COMMIT: ${{ github.sha }}
jobs:
  ios:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jhaizhou-ops/d2r-mobile
          ref: v1.0.16
          fetch-depth: 0
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install interface dependencies
        run: python -m pip install -r requirements.txt pillow==12.1.1 numpy==2.4.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: runtime-prepared-packages
          path: outputs
          run-id: 38736290858
          github-token: ${{ github.token }}
      - name: Record current source
        run: python scripts/source/configure.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-source-inputs
          path: .baseline
          run-id: 38736290858
          github-token: ${{ github.token }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .tools/png-zlib-ng-2.3.2
          key: png-backend-Linux-X64-de36b50f9835da2b2e986c78e2cad72cb4205fff047625df49188bc876543ee8
          fail-on-cache-miss: true
      - name: Verify cold and cached interface bytes
        env:
          LD_PRELOAD: ${{ github.workspace }}/.tools/png-zlib-ng-2.3.2/lib/libz.so.1
        run: python -u .github/scripts/validate_prepared_runtime.py ios
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-interface-cache-report
          path: outputs/interface-cache-report.json
          retention-days: 3
          if-no-files-found: error
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jhaizhou-ops/d2r-mobile
          ref: v1.0.16
          fetch-depth: 0
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install interface dependencies
        run: python -m pip install -r requirements.txt pillow==12.1.1 numpy==2.4.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: runtime-prepared-packages
          path: outputs
          run-id: 38736290858
          github-token: ${{ github.token }}
      - name: Record current source
        run: python scripts/source/configure.py
      - name: Select Apple toolchain
        run: python scripts/source/select_xcode.py
      - name: Check Metal inspection tool
        run: xcrun --sdk macosx metal-objdump --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Validate cached generation and both Mac apps
        run: python -u .github/scripts/validate_prepared_runtime.py macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macOS-runtime-validation
          path: |
            outputs/D2RMobile-*-macos*.zip
            outputs/macos-build-report.json
            outputs/Mac-SHA256SUMS.txt
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-interface-cache-report
          path: outputs/interface-cache-report.json
          retention-days: 3
          if-no-files-found: error
