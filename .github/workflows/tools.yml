name: Prebuild open-source tools
on:
  push:
    branches: [feat/build-template]
    paths:
      - scripts/build_tool.sh
      - scripts/prebuilt_tools.py
      - scripts/publish_tools.py
      - build-config.json
      - .github/workflows/tools.yml
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Upstream tool source ref; empty selects the latest official Release'
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: prebuild-open-source-tools
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'jiayx/d2r-mobile-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kind: [spirv, png, xlate]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select upstream tool sources
        if: matrix.kind == 'xlate'
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: jhaizhou-ops/d2r-mobile
          SOURCE_REF: ${{ inputs.source_ref }}
        run: python3 scripts/source/resolve.py
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: matrix.kind == 'xlate'
        with:
          repository: jhaizhou-ops/d2r-mobile
          ref: ${{ steps.source.outputs.ref }}
          path: upstream
          persist-credentials: false
          sparse-checkout: |
            LICENSE
            dm/gfx/tools/dmsh_xlate
            dm/third_party/ryujinx
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        if: matrix.kind == 'xlate'
        with:
          dotnet-version: '10.0.x'
      - name: Install build dependencies
        if: matrix.kind != 'xlate'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build
      - name: Build the open-source tool and license notices
        env:
          TOOL_KIND: ${{ matrix.kind }}
        run: python3 scripts/prebuilt_tools.py build "$TOOL_KIND"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tool-${{ matrix.kind }}
          path: outputs/tools/${{ matrix.kind }}/
          if-no-files-found: error
          retention-days: 3
          overwrite: true
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: tool-*
          path: downloaded-tools
      - name: Publish validated tool packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/tools
          for kind in spirv png xlate; do
            mv "downloaded-tools/tool-$kind" "outputs/tools/$kind"
          done
          python3 scripts/publish_tools.py
