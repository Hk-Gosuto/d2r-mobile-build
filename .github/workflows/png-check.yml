name: Check PNG encoder compatibility
on:
  workflow_dispatch:
    inputs:
      diagnostic_run:
        description: Run containing a private png-compat artifact
        required: true
        default: '38242350259'
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore small private diagnostic sample
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIAGNOSTIC_RUN: ${{ inputs.diagnostic_run }}
        run: gh run download "$DIAGNOSTIC_RUN" --pattern 'png-compat-*' --dir sample
      - name: Test official Pillow wheel
        continue-on-error: true
        run: |
          python -m pip install --only-binary=:all: pillow==12.1.1
          python scripts/png_probe.py sample
      - name: Build the matching zlib-ng compatibility library
        run: |
          curl -fL --retry 3 https://github.com/zlib-ng/zlib-ng/archive/6d9f3dc072369dc719a5fbe71d4e086a96a680bd.tar.gz -o zlib-ng.tar.gz
          tar -xzf zlib-ng.tar.gz
          cmake -S zlib-ng-6d9f3dc072369dc719a5fbe71d4e086a96a680bd -B zlib-build -DZLIB_COMPAT=ON -DBUILD_SHARED_LIBS=ON -DZLIB_ENABLE_TESTS=OFF -DWITH_GTEST=OFF -DCMAKE_INSTALL_PREFIX="$PWD/zlib-install" -DCMAKE_BUILD_TYPE=Release
          cmake --build zlib-build -j2
          cmake --install zlib-build
          LD_PRELOAD="$PWD/zlib-install/lib/libz.so.1" python scripts/png_probe.py sample
